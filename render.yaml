# Render Blueprint: the API.  Render → New → Blueprint → pick this repo.
# The UI is on Vercel (frontend/vercel.json) and reaches this API through a rewrite.
#
# Two modes (backend/start.sh):
#   DEMO_FAKE_AWS=true   seeded fake AWS account on a throwaway SQLite file. No database, no AWS keys.
#                        Data resets whenever the free instance sleeps or redeploys.
#   DEMO_FAKE_AWS=false  your real AWS account. Needs DATABASE_URL pointing at a Postgres that does not
#                        expire (Render's free Postgres is deleted after 30 days; Neon's free tier is not).
# Free web services sleep after 15 min idle; the first request then takes about a minute.

services:
  - type: web
    name: nimbus-risk-sentinel-api     # → https://nimbus-risk-sentinel-api.onrender.com
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    # moto (fake AWS) + pytest, which the seeding module imports, only in demo mode
    buildCommand: pip install -r requirements.txt && if [ "$DEMO_FAKE_AWS" = "true" ]; then pip install -r requirements-dev.txt; fi
    startCommand: ./start.sh

    healthCheckPath: /api/v1/auth/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_FAKE_AWS
        value: "true"            # set to "false" once DATABASE_URL and the AWS role below are filled in
      # Demo login: admin@ / approver@ / engineer@ / viewer@breachpath.local with the public password in the
      # README (breachpath-demo-password). Demo mode blocks people and password changes, and the data is
      # fake and resets. To make the demo private instead, add DEMO_PASSWORD in Render → Environment.
      - key: DATABASE_URL        # real mode only: e.g. a Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # First-admin setup screen asks for this, so a stranger who finds the URL first can't claim admin.
      # Copy it from Render → Environment when you create your account.
      - key: SETUP_TOKEN
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict            # the browser only ever sees the Vercel origin
      - key: FRONTEND_ORIGINS
        value: https://cloud-security-posture-delta.vercel.app
      - key: SCAN_EXECUTOR
        value: background        # single instance, no Redis/Celery needed
      - key: EVENTS_BACKEND
        value: memory
      - key: SCAN_INTERVAL_MINUTES
        value: "60"

      # AWS: a keys-only IAM user that can do nothing except assume NimbusScannerRole.
      # Create both with infra/aws/setup-render-scanner.sh, then paste the values here in the dashboard.
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-2
      - key: AWS_REGIONS
        value: ap-southeast-2
      - key: AWS_ROLE_ARN
        sync: false
      - key: AWS_EXTERNAL_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: REMEDIATION_ENABLED
        value: "false"           # read-only until a separate write role is set up
      - key: REMEDIATION_TWO_PERSON_RULE
        value: "true"

      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-flash-latest
      - key: AI_API_KEY
        sync: false
      - key: SLACK_ENABLED
        value: "false"
