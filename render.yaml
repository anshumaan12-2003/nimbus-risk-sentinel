# Render Blueprint: API + Postgres.  Render → New → Blueprint → pick this repo.
# The UI is on Vercel (frontend/vercel.json) and reaches this API through a rewrite.
#
# Plans: "free" sleeps after 15 min idle (scheduled scans stop, first request takes ~1 min) and a free
# Postgres is deleted after 30 days. For real use switch to web "starter" + database "basic-256mb".

databases:
  - name: nimbus-db
    databaseName: nimbus
    user: nimbus
    plan: free
    region: singapore          # closest Render region to ap-southeast-2

services:
  - type: web
    name: nimbus-risk-sentinel-api     # → https://nimbus-risk-sentinel-api.onrender.com
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: lockout is keyed on email+IP, so read the real client IP from X-Forwarded-For
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/v1/auth/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: nimbus-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      # First-admin setup screen asks for this, so a stranger who finds the URL first can't claim admin.
      # Copy it from Render → Environment when you create your account.
      - key: SETUP_TOKEN
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict            # the browser only ever sees the Vercel origin
      - key: FRONTEND_ORIGINS
        value: https://nimbus-risk-sentinel.vercel.app
      - key: SCAN_EXECUTOR
        value: background        # single instance, no Redis/Celery needed
      - key: EVENTS_BACKEND
        value: memory
      - key: SCAN_INTERVAL_MINUTES
        value: "60"

      # AWS: a keys-only IAM user that can do nothing except assume NimbusScannerRole.
      # Create both with infra/aws/setup-render-scanner.sh, then paste the values here in the dashboard.
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-2
      - key: AWS_REGIONS
        value: ap-southeast-2
      - key: AWS_ROLE_ARN
        sync: false
      - key: AWS_EXTERNAL_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: REMEDIATION_ENABLED
        value: "false"           # read-only until a separate write role is set up
      - key: REMEDIATION_TWO_PERSON_RULE
        value: "true"

      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-flash-latest
      - key: AI_API_KEY
        sync: false
      - key: SLACK_ENABLED
        value: "false"
