<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Breachpath Cloud Recon</title>
  <desc id="d">See the risk before the breach. An attack path runs from the internet through an EC2 instance and an IAM user to crown-jewel data stores.</desc>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .path { stroke-dasharray: 7 7; animation: flow 1.2s linear infinite; }
    .draw { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 5s ease-in-out infinite; }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    .p2 { animation-delay: .8s; } .p3 { animation-delay: 1.6s; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .rise { opacity: 0; animation: rise .8s ease-out forwards; }
    .r2 { animation-delay: .15s; } .r3 { animation-delay: .3s; } .r4 { animation-delay: .45s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes draw { 0% { stroke-dashoffset: 520; } 45%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -520; } }
    @keyframes sweep { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(470px); opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.3); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .path, .draw, .sweep, .pulse, .blink, .rise { animation: none; }
      .draw { stroke-dashoffset: 0; } .rise { opacity: 1; } .sweep, .pulse { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1020"/><stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".45" r=".55">
      <stop offset="0" stop-color="#3b5bdb" stop-opacity=".30"/><stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#5b7cfa" stop-opacity="0"/><stop offset=".8" stop-color="#5b7cfa" stop-opacity=".22"/><stop offset="1" stop-color="#8aa2ff" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- Left: identity -->
    <g class="rise">
      <rect x="64" y="70" width="56" height="56" rx="14" fill="#f4f5f7"/>
      <path d="M92 83l15 6v10c0 10-6.5 17-15 20-8.5-3-15-10-15-20V89z" fill="none" stroke="#111318" stroke-width="3" stroke-linejoin="round"/>
      <path d="M86 100l4.5 4.5 8-9" fill="none" stroke="#111318" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="136" y="96" class="f" font-size="15" font-weight="600" fill="#8aa2ff" letter-spacing="2.4">CLOUD SECURITY POSTURE</text>
      <text x="136" y="120" class="f" font-size="15" fill="#9aa0ab">for AWS · self-hosted · FastAPI + React</text>
    </g>
    <text x="64" y="190" class="f rise r2" font-size="50" font-weight="700" fill="#f4f5f7" letter-spacing="-1">Breachpath Cloud Recon</text>
    <text x="64" y="232" class="f rise r3" font-size="22" fill="#c3c7cf">See the risk before the breach<tspan class="blink" fill="#8aa2ff">_</tspan></text>
    <g class="rise r4 m" font-size="13">
      <rect x="64" y="262" width="118" height="30" rx="15" fill="#ef4444" fill-opacity=".12" stroke="#ef4444" stroke-opacity=".45"/>
      <text x="123" y="282" text-anchor="middle" fill="#fca5a5">attack paths</text>
      <rect x="192" y="262" width="126" height="30" rx="15" fill="#3b5bdb" fill-opacity=".14" stroke="#5b7cfa" stroke-opacity=".5"/>
      <text x="255" y="282" text-anchor="middle" fill="#b4c3ff">four-eyes fixes</text>
      <rect x="328" y="262" width="104" height="30" rx="15" fill="#22c55e" fill-opacity=".10" stroke="#22c55e" stroke-opacity=".45"/>
      <text x="380" y="282" text-anchor="middle" fill="#86efac">live scans</text>
    </g>

    <!-- Right: an attack path, drawn from the internet to three crown jewels -->
    <g transform="translate(690 0)">
      <g class="m" font-size="10.5" fill="#6b7280" letter-spacing="1.5" text-anchor="middle">
        <text x="30" y="92">INTERNET</text><text x="140" y="92">COMPUTE</text>
        <text x="250" y="92">IDENTITY</text><text x="380" y="92">DATA</text>
      </g>
      <!-- other access (quiet) -->
      <g stroke="#3a3f4b" stroke-width="1.5" fill="none">
        <path d="M44 180C90 130 110 120 236 120"/><path d="M264 240C320 240 330 180 366 180"/>
      </g>
      <!-- critical path -->
      <g stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path class="draw" d="M44 180H126M154 180H236M264 180C310 180 320 120 366 120"/>
        <path class="path" d="M264 180H366M264 180C310 180 320 240 366 240" stroke-opacity=".85"/>
      </g>
      <!-- nodes -->
      <g>
        <circle cx="30" cy="180" r="15" fill="#3b5bdb" class="pulse"/>
        <circle cx="30" cy="180" r="15" fill="#18203d" stroke="#5b7cfa" stroke-width="2"/>
        <circle cx="30" cy="180" r="6" fill="none" stroke="#b4c3ff" stroke-width="1.6"/>
        <path d="M24 180h12M30 174c3 3.5 3 8.5 0 12M30 174c-3 3.5-3 8.5 0 12" stroke="#b4c3ff" stroke-width="1.2" fill="none"/>

        <rect x="126" y="166" width="28" height="28" rx="7" fill="#1a1c22" stroke="#4b5060"/>
        <rect x="133" y="173" width="14" height="5" rx="1.5" fill="none" stroke="#c3c7cf" stroke-width="1.4"/>
        <rect x="133" y="182" width="14" height="5" rx="1.5" fill="none" stroke="#c3c7cf" stroke-width="1.4"/>
        <text x="140" y="214" class="m" font-size="11" fill="#9aa0ab" text-anchor="middle">api-worker</text>

        <rect x="236" y="106" width="28" height="28" rx="7" fill="#1a1c22" stroke="#4b5060"/>
        <rect x="236" y="166" width="28" height="28" rx="7" fill="#2a1a12" stroke="#f97316"/>
        <circle cx="247" cy="180" r="4" fill="none" stroke="#fdba74" stroke-width="1.6"/><path d="M251 180h7v4" fill="none" stroke="#fdba74" stroke-width="1.6"/>
        <text x="250" y="214" class="m" font-size="11" fill="#fdba74" text-anchor="middle">dev-intern · no MFA</text>
        <rect x="236" y="226" width="28" height="28" rx="7" fill="#1a1c22" stroke="#4b5060"/>

        <g fill="#2a1316" stroke="#ef4444">
          <rect x="366" y="106" width="28" height="28" rx="7"/><rect x="366" y="166" width="28" height="28" rx="7"/><rect x="366" y="226" width="28" height="28" rx="7"/>
        </g>
        <circle cx="380" cy="120" r="14" fill="#ef4444" class="pulse"/>
        <circle cx="380" cy="180" r="14" fill="#ef4444" class="pulse p2"/>
        <circle cx="380" cy="240" r="14" fill="#ef4444" class="pulse p3"/>
        <g fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-linejoin="round">
          <path d="M373 126l-1-9 4.5 3.5 3.5-5 3.5 5 4.5-3.5-1 9z"/><path d="M373 186l-1-9 4.5 3.5 3.5-5 3.5 5 4.5-3.5-1 9z"/><path d="M373 246l-1-9 4.5 3.5 3.5-5 3.5 5 4.5-3.5-1 9z"/>
        </g>
        <g class="m" font-size="11" fill="#fca5a5">
          <text x="404" y="124">customer-data</text><text x="404" y="184">billing-db</text><text x="404" y="244">customers</text>
        </g>
      </g>
      <!-- scanner sweep -->
      <rect class="sweep" x="-30" y="100" width="36" height="170" fill="url(#beam)"/>
      <text x="0" y="298" class="m" font-size="12" fill="#6b7280">3 of 3 crown jewels reachable · 3 fixes cut them all off</text>
    </g>
  </g>
</svg>
