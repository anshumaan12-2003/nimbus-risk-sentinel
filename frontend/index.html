<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Theme before first paint (no flash): saved choice, else follow the OS.
      (function () {
        var t;
        try { t = localStorage.getItem('nimbus-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
      // Last-resort handler for errors that happen before React mounts (module load failures,
      // etc.) — React's ErrorBoundary catches everything after mount. Uses the theme tokens.
      window.onerror = function (msg, url, line, col, error) {
        console.error('[nimbus] fatal boot error:', msg, error && error.stack);
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center;padding:24px;">' +
            '<div style="font-size:15px;font-weight:600;">Nimbus couldn\u2019t start</div>' +
            '<div style="font-size:13px;color:var(--fg-2);max-width:420px;">Reloading usually fixes this. If it keeps happening, the browser console has the details.</div>' +
            '<button onclick="location.reload()" style="margin-top:8px;padding:8px 14px;background:var(--fg);color:var(--bg);border:0;border-radius:8px;font:500 13px system-ui,sans-serif;cursor:pointer;">Reload</button>' +
            '</div>';
        }
      };
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nimbus Risk Sentinel — Cloud Security Posture Management Platform. Real-time AWS misconfiguration detection, blast radius visualization, and one-click remediation." />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e16" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233e63dd' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E" />
    <title>Nimbus Risk Sentinel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
