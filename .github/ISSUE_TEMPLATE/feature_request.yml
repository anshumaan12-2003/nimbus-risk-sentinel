name: Feature request
description: Suggest a new rule, page or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not only the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
