name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Findings
        2. Click …
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Live demo, Local (fake AWS), Local (real AWS account), Docker Compose, Self-hosted]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown by /health, or the release you're on.
      placeholder: "1.5.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove account ids, keys and anything else private first.
      render: text
