# Every push proves: backend lint + tests pass, migrations run on Postgres, both Docker images build, the UI builds,
# every page renders against a real API, the security flows work in a real browser, and no page changed visually.
name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic ../cli
      - run: pytest -q

  # Production runs Postgres; SQLite tests can't prove the Alembic chain (type changes, defaults) works there
  migrations:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nimbus, POSTGRES_PASSWORD: nimbus, POSTGRES_DB: nimbus }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nimbus" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nimbus:nimbus@localhost:5432/nimbus
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade 004 && alembic upgrade head   # latest migration is reversible

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t breachpath-api backend
      - run: docker build -t breachpath-ui frontend

  frontend:
    runs-on: ubuntu-latest
    # Official image: same Chromium + fonts as the committed screenshot baselines
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Python for the fake-AWS API
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /opt/venv && /opt/venv/bin/pip install -r backend/requirements-dev.txt
      - name: Install + build
        working-directory: frontend
        run: npm ci && npm run lint && npm run build
      - name: Colour contrast (every text token pair is WCAG AA in both themes)
        working-directory: frontend
        run: node scripts/check-contrast.mjs
      - name: Unit / route smoke tests (against a fake-AWS API)
        working-directory: frontend
        run: |
          (cd ../backend && /opt/venv/bin/python tests/dev_server_fake_aws.py &) 
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          API_URL=http://127.0.0.1:8000 npm test
      - name: Playwright (flows + visual regression)
        working-directory: frontend
        env: { NIMBUS_PYTHON: /opt/venv/bin/python, HOME: /root }
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
